<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBrainOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 20px; font-weight: 600; color: #fff; }

    header .badge {
      background: #1a3a2a;
      color: #4ade80;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid #2a5a3a;
    }

    .status-bar {
      background: #111;
      border-bottom: 1px solid #1a1a1a;
      padding: 8px 24px;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #666;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      background: #111;
      border-right: 1px solid #1a1a1a;
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .sidebar-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #aaa;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 4px;
      transition: all 0.15s;
    }

    .sidebar-btn:hover, .sidebar-btn.active {
      background: #1a1a1a;
      color: #fff;
    }

    .scan-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
    }

    .scan-section input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .scan-section input:focus { border-color: #4ade80; }

    .btn {
      background: #1a3a2a;
      color: #4ade80;
      border: 1px solid #2a5a3a;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: all 0.15s;
    }

    .btn:hover { background: #2a5a3a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .main { display: flex; flex-direction: column; overflow: hidden; }

    .panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .panel.active { display: flex; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.user {
      background: #1a2a3a;
      border: 1px solid #2a3a4a;
      align-self: flex-end;
      color: #93c5fd;
    }

    .message.ai {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      align-self: flex-start;
      color: #e0e0e0;
    }

    .message.thinking { color: #555; font-style: italic; }

    .chat-input-area {
      border-top: 1px solid #1a1a1a;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .chat-input-area input:focus { border-color: #4ade80; }

    .chat-input-area button {
      background: #1a3a2a;
      color: #4ade80;
      border: 1px solid #2a5a3a;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .audit-container { flex: 1; overflow-y: auto; padding: 24px; }

    .audit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .audit-header h2 { font-size: 18px; color: #fff; }

    .audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .audit-card {
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 16px;
    }

    .audit-card h3 {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .audit-card pre {
      font-size: 13px;
      color: #aaa;
      white-space: pre-wrap;
      font-family: 'Menlo', monospace;
      line-height: 1.5;
    }

    .git-container { flex: 1; overflow-y: auto; padding: 24px; }

    .commit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

    .commit-item {
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 70px 100px 1fr;
      gap: 12px;
      font-size: 13px;
    }

    .commit-hash { color: #4ade80; font-family: monospace; }
    .commit-date { color: #666; }
    .commit-msg { color: #ccc; }

    .loading { color: #555; font-style: italic; padding: 8px 0; }
    .error { color: #f87171; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>DevBrainOS</h1>
  <span class="badge">local-first</span>
</header>

<div class="status-bar">
  <div>Indexed files: <span id="indexed-count">—</span></div>
  <div>API: <span id="api-status">checking...</span></div>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>Navigation</h3>
    <button class="sidebar-btn active" id="btn-chat" onclick="showPanel('chat')">💬 Chat</button>
    <button class="sidebar-btn" id="btn-audit" onclick="showPanel('audit')">🔍 Audit</button>
    <button class="sidebar-btn" id="btn-git" onclick="showPanel('git')">📋 Git Analysis</button>
    <button class="sidebar-btn" id="btn-summary" onclick="showPanel('summary')">🧠 Summary</button>

    <div class="scan-section">
      <h3>Index Project</h3>
      <input type="text" id="scan-dir" placeholder="/path/to/project" />
      <button class="btn" id="scan-btn" onclick="runScan()">Scan Directory</button>
    </div>
  </div>

  <div class="main">
    <div class="panel active" id="panel-chat">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask about your codebase..."
          onkeydown="if(event.key==='Enter') sendChat()" />
        <button onclick="sendChat()">Send</button>
      </div>
    </div>

    <div class="panel" id="panel-audit">
      <div class="audit-container">
        <div class="audit-header">
          <h2>Full AI Audit</h2>
          <button class="btn" style="width:auto;padding:8px 20px" onclick="runAudit()">Run Audit</button>
        </div>
        <div id="audit-results"></div>
      </div>
    </div>

    <div class="panel" id="panel-summary">
      <div class="audit-container">
        <div class="audit-header">
          <h2>Codebase Summary</h2>
          <button class="btn" style="width:auto;padding:8px 20px" onclick="runSummary()">Summarize</button>
        </div>
        <div id="summary-results">
          <p class="loading">Click "Summarize" to get an AI overview of your indexed codebase.</p>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-git">
      <div class="git-container">
        <h2 style="margin-bottom:16px;font-size:18px;color:#fff">Git Intelligence</h2>
        <div id="git-commits"></div>
        <div id="git-analysis"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:3737';

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function makeMessage(text, cls) {
    const el = document.createElement('div');
    el.className = `message ${cls}`;
    el.textContent = text;
    return el;
  }

  function makeCard(title, content) {
    const card = document.createElement('div');
    card.className = 'audit-card';
    const h = document.createElement('h3');
    h.textContent = title;
    const pre = document.createElement('pre');
    pre.textContent = content;
    card.appendChild(h);
    card.appendChild(pre);
    return card;
  }

  async function checkStatus() {
    const apiEl = document.getElementById('api-status');
    const countEl = document.getElementById('indexed-count');
    try {
      const res = await fetch(`${API}/health`);
      if (res.ok) { apiEl.textContent = 'connected'; apiEl.style.color = '#4ade80'; }
    } catch { apiEl.textContent = 'offline'; apiEl.style.color = '#f87171'; }
    try {
      const res = await fetch(`${API}/api/scan/status`);
      const data = await res.json();
      countEl.textContent = data.indexed_files;
    } catch { countEl.textContent = '0'; }
  }

  function showPanel(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`panel-${name}`).classList.add('active');
    document.getElementById(`btn-${name}`).classList.add('active');
    if (name === 'git') loadGitCommits();
  }

  async function runScan() {
    const dir = document.getElementById('scan-dir').value.trim();
    if (!dir) { alert('Enter a directory path'); return; }
    const btn = document.getElementById('scan-btn');
    btn.disabled = true;
    btn.textContent = 'Scanning...';
    try {
      const res = await fetch(`${API}/api/scan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir }),
      });
      const data = await res.json();
      alert(`Indexed ${data.indexed} files`);
      checkStatus();
    } catch (err) {
      alert('Scan failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Scan Directory';
    }
  }

  async function sendChat() {
    const input = document.getElementById('chat-input');
    const question = input.value.trim();
    if (!question) return;
    const msgs = document.getElementById('chat-messages');
    msgs.appendChild(makeMessage(question, 'user'));
    const thinking = makeMessage('Thinking...', 'ai thinking');
    thinking.id = 'thinking-msg';
    msgs.appendChild(thinking);
    msgs.scrollTop = msgs.scrollHeight;
    input.value = '';
    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      document.getElementById('thinking-msg').remove();
      msgs.appendChild(makeMessage(data.answer || data.error || 'No response', 'ai'));
    } catch (err) {
      document.getElementById('thinking-msg').remove();
      msgs.appendChild(makeMessage('Error: ' + err.message, 'ai'));
    }
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function runSummary() {
    const container = document.getElementById('summary-results');
    container.textContent = '';
    const loading = document.createElement('p');
    loading.className = 'loading';
    loading.textContent = 'Summarizing indexed codebase...';
    container.appendChild(loading);
    try {
      const res = await fetch(`${API}/api/chat/summary`);
      const data = await res.json();
      container.textContent = '';
      container.appendChild(makeCard('Codebase Summary', data.summary || data.error || 'No summary available'));
    } catch (err) {
      container.textContent = '';
      const errEl = document.createElement('p');
      errEl.className = 'error';
      errEl.textContent = 'Summary failed: ' + err.message;
      container.appendChild(errEl);
    }
  }

  async function runAudit() {
    const container = document.getElementById('audit-results');
    container.textContent = '';
    const loading = document.createElement('p');
    loading.className = 'loading';
    loading.textContent = 'Running all agents in parallel... this may take a minute.';
    container.appendChild(loading);
    const dir = document.getElementById('scan-dir').value.trim() || undefined;
    try {
      const res = await fetch(`${API}/api/debug/audit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir }),
      });
      const data = await res.json();
      container.textContent = '';
      if (data.error) {
        const err = document.createElement('p');
        err.className = 'error';
        err.textContent = data.error;
        container.appendChild(err);
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'audit-grid';
      grid.appendChild(makeCard('Code Analysis', data.code));
      grid.appendChild(makeCard('Bug Detection', data.debug));
      grid.appendChild(makeCard('QA / Edge Cases', data.qa));
      grid.appendChild(makeCard('Architecture', data.architecture));
      container.appendChild(grid);
    } catch (err) {
      container.textContent = '';
      const errEl = document.createElement('p');
      errEl.className = 'error';
      errEl.textContent = 'Audit failed: ' + err.message;
      container.appendChild(errEl);
    }
  }

  async function loadGitCommits() {
    const commitEl = document.getElementById('git-commits');
    commitEl.textContent = '';
    const loading = document.createElement('p');
    loading.className = 'loading';
    loading.textContent = 'Loading commits...';
    commitEl.appendChild(loading);
    try {
      const res = await fetch(`${API}/api/git/commits`);
      const data = await res.json();
      commitEl.textContent = '';
      if (!data.commits || data.commits.length === 0) {
        const p = document.createElement('p');
        p.className = 'loading';
        p.textContent = 'No git history found.';
        commitEl.appendChild(p);
        return;
      }
      const label = document.createElement('h3');
      label.style.cssText = 'font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px';
      label.textContent = 'Recent Commits';
      commitEl.appendChild(label);
      const list = document.createElement('div');
      list.className = 'commit-list';
      for (const c of data.commits) {
        const row = document.createElement('div');
        row.className = 'commit-item';
        const hash = document.createElement('span');
        hash.className = 'commit-hash';
        hash.textContent = c.hash.slice(0, 7);
        const date = document.createElement('span');
        date.className = 'commit-date';
        date.textContent = c.date.slice(0, 10);
        const msg = document.createElement('span');
        msg.className = 'commit-msg';
        msg.textContent = c.message;
        row.appendChild(hash);
        row.appendChild(date);
        row.appendChild(msg);
        list.appendChild(row);
      }
      commitEl.appendChild(list);
      const analyzeBtn = document.createElement('button');
      analyzeBtn.className = 'btn';
      analyzeBtn.style.cssText = 'width:auto;padding:8px 20px;margin-bottom:16px';
      analyzeBtn.textContent = 'Run AI Analysis';
      analyzeBtn.onclick = loadGitAnalysis;
      commitEl.appendChild(analyzeBtn);
    } catch (err) {
      commitEl.textContent = '';
      const errEl = document.createElement('p');
      errEl.className = 'error';
      errEl.textContent = 'Failed to load commits: ' + err.message;
      commitEl.appendChild(errEl);
    }
  }

  async function loadGitAnalysis() {
    const analysisEl = document.getElementById('git-analysis');
    analysisEl.textContent = '';
    const loading = document.createElement('p');
    loading.className = 'loading';
    loading.textContent = 'Analyzing with AI...';
    analysisEl.appendChild(loading);
    try {
      const res = await fetch(`${API}/api/git/analyze`);
      const data = await res.json();
      analysisEl.textContent = '';
      analysisEl.appendChild(makeCard('AI Git Analysis', data.analysis || 'No analysis available'));
    } catch (err) {
      analysisEl.textContent = '';
      const errEl = document.createElement('p');
      errEl.className = 'error';
      errEl.textContent = 'Analysis failed: ' + err.message;
      analysisEl.appendChild(errEl);
    }
  }

  // Init
  const msgs = document.getElementById('chat-messages');
  msgs.appendChild(makeMessage('Hello! Scan a project first, then ask me anything about your codebase.', 'ai'));
  const auditResults = document.getElementById('audit-results');
  const auditHint = document.createElement('p');
  auditHint.className = 'loading';
  auditHint.textContent = 'Click "Run Audit" to analyze your indexed codebase with all agents.';
  auditResults.appendChild(auditHint);

  checkStatus();
  setInterval(checkStatus, 30000);
</script>
</body>
</html>
